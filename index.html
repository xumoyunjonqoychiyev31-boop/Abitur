<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0c0f">
<title>ABITUR DTM — Texnik xizmat</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<style>
:root{--gold:#e8b84b;--gold2:#f5d98a;--text:#f0efe9;--muted:#9a9a9a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);background:radial-gradient(ellipse at 50% 0,rgba(232,184,75,.08),transparent 55%),linear-gradient(160deg,#0b0c0f,#101116 50%,#0b0c0f);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.box{max-width:420px;width:100%;background:#15171c;border:1px solid rgba(232,184,75,.25);border-radius:18px;padding:32px 22px}
.box img{width:72px;height:auto;margin-bottom:10px}
.brand{font-weight:700;letter-spacing:3px;font-size:20px;color:var(--gold2);margin-bottom:22px}
.gear{font-size:44px;display:inline-block;animation:spin 6s linear infinite;margin-bottom:10px}
h1{font-size:21px;color:var(--gold2);margin-bottom:12px;line-height:1.35}
p{font-size:14px;color:var(--muted);line-height:1.6}
.btn{display:inline-block;margin-top:20px;padding:12px 22px;border-radius:10px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#111;font-weight:700;font-size:14px;text-decoration:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.gear{animation:none}}
</style>
</head>
<body>
<div class="box">
  <img src="assets/logo.png" alt="ABITUR DTM">
  <div class="brand">ABITUR DTM</div>
  <div class="gear">⚙️</div>
  <h1>Texnik xizmat olib borilmoqda</h1>
  <p>Saytni yaxshilash ustida ishlayapmiz. Tez orada qaytamiz. Noqulaylik uchun uzr so‘raymiz.</p>
  <a class="btn" href="https://t.me/Xumoyun_1509" target="_blank" rel="noopener">Admin bilan bog‘lanish</a>
</div>
</body>
</html>
