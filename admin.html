<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ABITUR DTM · Admin</title><meta name="robots" content="noindex,nofollow">
<style>
:root{--g:#e8b84b;--g2:#f5d98a;--bg:#0b0d12;--p:#15171d;--p2:#1b1e26;--m:#9aa3b2;--ok:#7bc96f;--bad:#ff6b6b;--ln:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{background:var(--bg);color:#fff;font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(11,13,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.logo{font-weight:800;letter-spacing:.14em;color:var(--g);font-size:15px;white-space:nowrap}
.mode{display:flex;background:var(--p);border:1px solid var(--ln);border-radius:30px;padding:3px;margin:0 auto}
.mode button{border:0;background:transparent;padding:8px 16px;border-radius:26px;font-weight:700;color:var(--m);cursor:pointer;font-size:14px}
.mode button.on{background:linear-gradient(135deg,var(--g2),var(--g));color:#111}
.lo{border:1px solid var(--ln);background:transparent;border-radius:10px;padding:8px 12px;color:var(--m);cursor:pointer;font-size:13px}
.wrap{display:flex;min-height:calc(100% - 58px)}
.nav{flex:none;width:210px;padding:14px 10px;border-right:1px solid var(--ln);position:sticky;top:58px;align-self:flex-start;height:calc(100vh - 58px);overflow:auto}
.nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 12px;margin-bottom:4px;border:0;background:transparent;border-radius:12px;color:#cfd3dc;cursor:pointer;font-weight:600}
.nav button.on{background:rgba(232,184,75,.14);color:var(--g2)}.nav button i{font-style:normal;width:22px;text-align:center}.nav .bd{margin-left:auto;background:var(--bad);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px}
.main{flex:1;min-width:0;padding:18px;max-width:980px}
h1{font-size:22px;margin-bottom:14px}h2{font-size:16px;margin:0 0 10px;color:var(--g2)}
.card{background:var(--p);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st{background:var(--p2);border:1px solid var(--ln);border-radius:14px;padding:12px}.st span{display:block;font-size:12px;color:var(--m)}.st b{font-size:22px;color:var(--g2)}
.f{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
label.l{display:block;font-size:12px;color:var(--m);margin-bottom:4px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(232,184,75,.3);background:#0f1116}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(232,184,75,.5)}
.hint{font-size:11px;color:var(--m);margin-top:3px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--g2),var(--g));color:#111}
.btn.o{background:transparent;border:1px solid rgba(232,184,75,.5);color:var(--g2)}.btn.r{background:rgba(255,107,107,.15);border:1px solid var(--bad);color:var(--bad)}.btn.s{padding:7px 12px;font-size:13px;border-radius:10px}.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.it{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px;border-radius:12px;background:var(--p2);border:1px solid var(--ln);margin-bottom:8px;flex-wrap:wrap}
.it b{font-size:15px}.it small{color:var(--m);display:block;font-size:12px}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(232,184,75,.15);color:var(--g2)}.tag.ok{background:rgba(123,201,111,.15);color:var(--ok)}.tag.bad{background:rgba(255,107,107,.15);color:var(--bad)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;border:1px solid var(--g);padding:12px 20px;border-radius:14px;z-index:99;display:none;max-width:90%}
.login{max-width:380px;margin:12vh auto;text-align:center;padding:22px}.login .logo{font-size:22px;margin-bottom:6px}
.uframe{display:flex;justify-content:center;padding:14px;height:calc(100vh - 58px)}
.dev{width:100%;max-width:430px;height:100%;border-radius:34px;border:10px solid #1b1e26;box-shadow:0 0 0 2px rgba(232,184,75,.4),0 30px 80px rgba(0,0,0,.7);overflow:hidden;background:#000}
.dev iframe{width:100%;height:100%;border:0}
.tabs{display:none}
@media(max-width:760px){.wrap{display:block}.nav{display:flex;width:auto;height:auto;position:sticky;top:58px;z-index:15;overflow-x:auto;padding:8px;background:var(--bg);border-right:0;border-bottom:1px solid var(--ln);gap:6px}.nav button{flex:none;width:auto;white-space:nowrap;margin:0;padding:9px 12px}.main{padding:14px}.logo{display:none}.uframe{padding:6px}.dev{border-width:6px;border-radius:24px}}
.hide{display:none!important}
</style></head><body>
<div id="toast"></div>

<div id="lg" class="login card">
  <div class="logo">ABITUR DTM</div><p style="color:var(--m);margin-bottom:16px">Admin panel</p>
  <input id="pw" type="password" placeholder="Admin paroli" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
  <button class="btn" style="width:100%;margin-top:12px" onclick="login()">Kirish</button>
  <p class="hint" style="margin-top:10px">Parol Google Sheets → Settings → admin_password</p>
</div>

<div id="app" class="hide">
  <div class="top"><span class="logo">ABITUR DTM</span>
    <div class="mode"><button id="mA" class="on" onclick="setMode('a')">🛠 Admin</button><button id="mU" onclick="setMode('u')">👤 Foydalanuvchi</button></div>
    <button class="lo" onclick="logout()">Chiqish</button></div>
  <div id="adm" class="wrap">
    <div class="nav" id="nav"></div>
    <div class="main" id="main"></div>
  </div>
  <div id="usr" class="uframe hide"><div class="dev"><iframe id="ifr" title="Foydalanuvchi ko'rinishi"></iframe></div></div>
</div>

<script>
const GAS_URL="https://script.google.com/macros/s/AKfycbwxdiemCqbYegJk1H91ST1TldG6Gx7fMVn-Qwz1VMdW4aigVtc0XfHutgx010pp7k0JYg/exec";
const $=s=>document.getElementById(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{n=Math.round((Number(n)||0)*100)/100;return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')};
let PW=null,TAB='home',BADGE={};
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}
async function A(action,x){
  try{const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,password:PW},x||{}))});return await r.json()}
  catch(e){return{ok:false,error:'Server bilan aloqa yo‘q'}}
}
async function login(){
  const p=$('pw').value;if(!p)return;const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'adminLogin',password:p})}).then(r=>r.json()).catch(()=>null);
  if(!r||!r.ok){toast((r&&r.error)||'Xatolik');return}
  PW=p;try{sessionStorage.setItem('adm_pw',p)}catch(e){}
  $('lg').classList.add('hide');$('app').classList.remove('hide');init();
}
function logout(){PW=null;try{sessionStorage.removeItem('adm_pw')}catch(e){}location.reload()}
function setMode(m){
  $('mA').classList.toggle('on',m==='a');$('mU').classList.toggle('on',m==='u');
  $('adm').classList.toggle('hide',m!=='a');$('usr').classList.toggle('hide',m!=='u');
  if(m==='u'&&!$('ifr').src)$('ifr').src='index.html';
}
const TABS=[['home','🏠','Bosh sahifa'],['set','⚙️','Sozlamalar'],['usr','👥','Foydalanuvchilar'],['pay','💳','To‘lovlar'],['wd','💸','Yechib olish'],['tst','📝','Testlar'],['wr','✍️','Yozma javoblar'],['vid','🎬','Video darslar']];
function init(){drawNav();go('home');A('adminStats').then(r=>{if(r.ok){BADGE={pay:r.payPending,wd:r.wdPending,wr:r.written};drawNav()}})}
function drawNav(){$('nav').innerHTML=TABS.map(t=>'<button class="'+(TAB===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><i>'+t[1]+'</i>'+t[2]+(BADGE[t[0]]?'<span class="bd">'+BADGE[t[0]]+'</span>':'')+'</button>').join('')}
function go(t){TAB=t;drawNav();$('main').innerHTML='<p style="color:var(--m)">Yuklanmoqda…</p>';({home:vHome,set:vSet,usr:vUsr,pay:vPay,wd:vWd,tst:vTst,wr:vWr,vid:vVid})[t]();scrollTo(0,0)}
const err=r=>{$('main').innerHTML='<div class="card">❌ '+esc((r&&r.error)||'Xatolik')+'</div>'};
async function act(fn,okMsg,reload){const r=await fn();if(!r||!r.ok){toast('❌ '+((r&&r.error)||'Xatolik'));return false}toast(okMsg||'✅ Bajarildi');if(reload)go(TAB);return true}

/* ---------- BOSH ---------- */
async function vHome(){
  const r=await A('adminStats');if(!r.ok)return err(r);BADGE={pay:r.payPending,wd:r.wdPending,wr:r.written};drawNav();
  const s=(l,v,c)=>'<div class="st"><span>'+l+'</span><b'+(c?' style="color:'+c+'"':'')+'>'+v+'</b></div>';
  $('main').innerHTML='<h1>Bosh sahifa</h1><div class="grid">'+s('Foydalanuvchilar',fmt(r.users))+s('Premium (faol tarif)',fmt(r.plan))+s('Jami balanslar',fmt(r.balance)+' so‘m')+s('Video darslar',r.videos)+'</div>'+
  '<h2 style="margin-top:18px">Savollar bazasi</h2><div class="grid">'+s('Sinov',r.tests.sinov)+s('Blok',r.tests.blok)+s('Sertifikat',r.tests.sertifikat)+'</div>'+
  '<h2 style="margin-top:18px">Kutilayotgan ishlar</h2><div class="grid">'+s('To‘lovlar',r.payPending,r.payPending?'var(--bad)':'')+s('Yechib olish',r.wdPending,r.wdPending?'var(--bad)':'')+s('Yozma javoblar',r.written,r.written?'var(--bad)':'')+'</div>'+
  '<p class="hint" style="margin-top:18px">«👤 Foydalanuvchi» tugmasi orqali saytni foydalanuvchi ko‘rgandek ko‘rishingiz mumkin.</p>';
}

/* ---------- SOZLAMALAR ---------- */
const GROUPS=[
 ['💳 Tariflar (0 = o‘chiq)',[['tarif7_narx','7 kunlik narx','so‘m'],['tarif7_kun','7 kunlik muddat','kun'],['tarif_narx','30 kunlik (oylik) narx','so‘m'],['tarif_kun','Oylik muddat','kun'],['tarif90_narx','90 kunlik narx','so‘m'],['tarif90_kun','90 kunlik muddat','kun']]],
 ['🧪 Test narxlari va limit',[['daily_free_tests','Kunlik bepul test/o‘yin soni','ta'],['price_sinov','Sinov test narxi (tarifsiz rejim)','so‘m'],['price_blok','Blok test narxi','so‘m'],['price_sertifikat','Sertifikat test narxi','so‘m'],['pdf_price','PDF narxi','so‘m']]],
 ['🎁 Bonuslar va yechib olish',[['signup_bonus','Ro‘yxatdan o‘tish bonusi','so‘m'],['referral_bonus','Taklif bonusi','so‘m'],['bonus90_sum','90% dan yuqori natija bonusi (kuniga 1)','so‘m'],['withdraw_min','Yechib olishning eng kam summasi','so‘m'],['withdraw_refs','Yechib olish uchun taklif soni','ta']]],
 ['🏆 Oylik reyting sovg‘alari',[['prize1_sum','1-o‘rin sovg‘asi','so‘m'],['prize1_days','1-o‘rin tarif kuni','kun'],['prize2_sum','2-o‘rin sovg‘asi','so‘m'],['prize2_days','2-o‘rin tarif kuni','kun'],['prize3_sum','3-o‘rin sovg‘asi','so‘m'],['prize3_days','3-o‘rin tarif kuni','kun'],['prize_min_score','Sovg‘a uchun minimal ball','ball']]],
 ['💰 To‘lov ma‘lumotlari',[['card_number','Karta raqami',''],['card_owner','Karta egasi',''],['click_on','Click orqali to‘lov (on/off)','']]],
 ['📞 Aloqa va havolalar',[['news_url','Guruh havolasi (Telegram)',''],['pdf_phone','Telefon',''],['pdf_telegram','Telegram (@...)',''],['fanlar','Fanlar ro‘yxati (vergul bilan)','']]]
];
async function vSet(){
  const r=await A('adminSettings');if(!r.ok)return err(r);const S=r.settings,known={};
  let h='<h1>Sozlamalar</h1>';
  GROUPS.forEach((g,gi)=>{
    h+='<div class="card"><h2>'+g[0]+'</h2><div class="f">'+g[1].map(f=>{known[f[0]]=1;return '<div><label class="l">'+f[1]+(f[2]?' · '+f[2]:'')+'</label><input data-g="'+gi+'" data-k="'+f[0]+'" data-o="'+esc(S[f[0]]==null?'':S[f[0]])+'" value="'+esc(S[f[0]]==null?'':S[f[0]])+'"><div class="hint">'+f[0]+'</div></div>'}).join('')+'</div><div style="margin-top:12px"><button class="btn" onclick="saveG('+gi+',this)">Saqlash</button></div></div>';
  });
  const rest=Object.keys(S).filter(k=>!known[k]);
  h+='<div class="card"><h2>🧩 Boshqa sozlamalar</h2>'+(rest.length?'<div class="f">'+rest.map(k=>'<div><label class="l">'+esc(k)+'</label><input data-g="x" data-k="'+esc(k)+'" data-o="'+esc(S[k])+'" value="'+esc(S[k])+'"></div>').join('')+'</div>':'<p class="hint">Qo‘shimcha kalit yo‘q.</p>')+
   '<div class="row" style="margin-top:12px"><input id="nk" placeholder="Yangi kalit" style="max-width:200px"><input id="nv" placeholder="Qiymat" style="max-width:240px"><button class="btn o" onclick="addKey()">+ Qo‘shish</button><button class="btn" onclick="saveG(\'x\',this)">Saqlash</button></div></div>'+
   '<div class="card"><h2>🔐 Admin parol</h2><div class="row"><input id="npw" type="password" placeholder="Yangi parol (kamida 6 belgi)" style="max-width:280px"><button class="btn" onclick="chPw()">O‘zgartirish</button></div></div>';
  $('main').innerHTML=h;
}
async function saveG(g,btn){
  const ins=[...document.querySelectorAll('input[data-g="'+g+'"]')].filter(i=>i.value!==i.dataset.o);
  if(!ins.length){toast('O‘zgarish yo‘q');return}
  btn.disabled=true;let n=0;
  for(const i of ins){const r=await A('adminSetSetting',{key:i.dataset.k,value:i.value});if(r.ok){n++;i.dataset.o=i.value}else toast('❌ '+i.dataset.k+': '+(r.error||'xato'))}
  btn.disabled=false;toast('✅ Saqlandi: '+n+' ta');
}
async function addKey(){const k=$('nk').value.trim(),v=$('nv').value;if(!k)return;if(await act(()=>A('adminSetSetting',{key:k,value:v}),'✅ Qo‘shildi'))vSet()}
async function chPw(){const p=$('npw').value;if(p.length<6){toast('Kamida 6 belgi');return}if(!confirm('Admin parol o‘zgartirilsinmi?'))return;if(await act(()=>A('adminSetSetting',{key:'admin_password',value:p}),'✅ Parol yangilandi. Qayta kiring')){setTimeout(logout,1200)}}

/* ---------- FOYDALANUVCHILAR ---------- */
let UL=[];
async function vUsr(){
  const r=await A('adminGetUsers');if(!r.ok)return err(r);UL=r.list.reverse();
  $('main').innerHTML='<h1>Foydalanuvchilar <span class="tag">'+UL.length+'</span></h1><div class="card"><input id="uq" placeholder="🔍 ID, ism yoki telefon bo‘yicha qidirish" oninput="drawU()"></div><div id="ul"></div>';drawU();
}
function drawU(){
  const q=($('uq').value||'').toLowerCase(),L=UL.filter(u=>!q||(u.id+' '+u.ism+' '+u.familiya+' '+u.telefon).toLowerCase().includes(q)).slice(0,60);
  $('ul').innerHTML=L.map(u=>'<div class="it"><div><b>'+esc(u.ism)+' '+esc(u.familiya)+'</b><small>ID '+esc(u.id)+' · '+esc(u.telefon||'—')+'</small><small>Balans: <b style="color:var(--g2)">'+fmt(u.balans)+' so‘m</b> · Test: '+u.testsCount+' · Ball: '+u.totalScore+'</small></div><div class="row"><button class="btn s o" onclick="uBal(\''+u.id+'\')">💰 Balans</button><button class="btn s o" onclick="uPlan(\''+u.id+'\')">⭐ Tarif</button><button class="btn s o" onclick="uEdit(\''+u.id+'\')">✏️</button></div></div>').join('')||'<p style="color:var(--m)">Topilmadi</p>';
}
async function uBal(id){const v=prompt('ID '+id+' balansiga qo‘shiladigan summa (manfiy — ayirish):');if(v===null)return;const n=Number(v);if(!isFinite(n)||!n)return;if(await act(()=>A('adminAddBalance',{id,amount:n}),'✅ Balans o‘zgardi'))vUsr()}
async function uPlan(id){const v=prompt('ID '+id+' ga necha kunlik tarif berilsin?','30');if(v===null)return;const n=Number(v);if(!n||n<1)return;if(await act(()=>A('adminGrantPlan',{id,days:n}),'✅ Tarif berildi'))vUsr()}
async function uEdit(id){
  const u=UL.find(x=>String(x.id)===String(id));const f=prompt('Qaysi maydon? ism / familiya / telefon / balans');if(!f||!['ism','familiya','telefon','balans'].includes(f))return;
  const v=prompt(f+' uchun yangi qiymat:',u[f]);if(v===null)return;if(await act(()=>A('adminEditUser',{id,field:f,value:v}),'✅ Saqlandi'))vUsr();
}

/* ---------- TO'LOVLAR ---------- */
async function vPay(){
  const r=await A('adminGetPayments');if(!r.ok)return err(r);const L=r.list.slice().reverse();
  $('main').innerHTML='<h1>To‘lovlar</h1>'+(L.map(p=>'<div class="it"><div><b>'+fmt(p.summa)+' so‘m</b> · ID '+esc(p.id)+'<small>'+esc(String(p.sana).slice(0,24))+(p.izoh?' · '+esc(p.izoh):'')+'</small></div><div class="row"><span class="tag '+(p.status==='Tasdiqlangan'?'ok':p.status==='Rad etilgan'?'bad':'')+'">'+esc(p.status)+'</span>'+(p.status==='Kutilmoqda'?'<button class="btn s" onclick="payDo('+p.row+',1)">✅ Tasdiqlash</button><button class="btn s r" onclick="payDo('+p.row+',0)">❌ Rad</button>':'')+'</div></div>').join('')||'<p style="color:var(--m)">To‘lov yo‘q</p>');
}
async function payDo(row,ok){if(!confirm(ok?'To‘lov tasdiqlansinmi? Balansga qo‘shiladi.':'To‘lov rad etilsinmi?'))return;if(await act(()=>A(ok?'adminConfirmPayment':'adminRejectPayment',{row}),'✅ Bajarildi'))vPay()}

/* ---------- YECHIB OLISH ---------- */
async function vWd(){
  const r=await A('adminWdList');if(!r.ok)return err(r);
  $('main').innerHTML='<h1>Yechib olish so‘rovlari</h1>'+(r.list.map(w=>'<div class="it"><div><b>'+fmt(w.sum)+' so‘m</b> · '+esc(w.name)+' (ID '+esc(w.id)+')<small>Karta: <b>'+esc(w.card)+'</b>'+(w.note?' · '+esc(w.note):'')+'</small></div><div class="row"><span class="tag '+(w.status==='Kutilmoqda'?'':w.status.indexOf('To')===0?'ok':'bad')+'">'+esc(w.status)+'</span>'+(w.status==='Kutilmoqda'?'<button class="btn s" onclick="wdDo('+w.row+',\'paid\')">✅ To‘landi</button><button class="btn s r" onclick="wdDo('+w.row+',\'reject\')">❌ Rad</button>':'')+'</div></div>').join('')||'<p style="color:var(--m)">So‘rov yo‘q</p>');
}
async function wdDo(row,a){let note='';if(a==='reject'){note=prompt('Rad etish sababi (ixtiyoriy):')||''}else if(!confirm('Pul kartaga o‘tkazildimi?'))return;if(await act(()=>A('adminWdSet',{row,act:a,note}),'✅ Bajarildi'))vWd()}

/* ---------- TESTLAR ---------- */
let TF={turi:'',q:''};
async function vTst(){
  const r=await A('adminTestList',TF);if(!r.ok)return err(r);
  $('main').innerHTML='<h1>Testlar</h1><div class="card"><h2>Bazadagi to‘plamlar</h2><div class="row" style="gap:6px">'+r.names.map(n=>'<span class="tag">'+esc(n.turi)+' · '+esc(n.nomi)+' · '+n.n+'</span>').join('')+'</div></div>'+
  '<div class="card"><h2>➕ Bitta savol qo‘shish</h2><div class="f"><div><label class="l">Turi</label><select id="a_t"><option>sinov</option><option>blok</option><option>sertifikat</option></select></div><div><label class="l">To‘plam nomi (masalan Matematika#1)</label><input id="a_n"></div><div><label class="l">Mavzu</label><input id="a_m" placeholder="Algebra"></div></div>'+
  '<div style="margin-top:10px"><label class="l">Savol</label><textarea id="a_s" style="min-height:70px"></textarea></div><div class="f" style="margin-top:8px"><input id="a_a" placeholder="A"><input id="a_b" placeholder="B"><input id="a_c" placeholder="C"><input id="a_d" placeholder="D"><input id="a_o" placeholder="To‘g‘ri javob (A/B/C/D)"><input id="a_p" placeholder="Ball" value="1"></div><div style="margin-top:8px"><input id="a_i" placeholder="Izoh (ixtiyoriy)"></div><button class="btn" style="margin-top:12px" onclick="addT()">Qo‘shish</button></div>'+
  '<div class="card"><h2>📥 JSON orqali ko‘plab savol</h2><div class="f"><div><label class="l">Turi</label><select id="j_t"><option>sinov</option><option>blok</option><option>sertifikat</option></select></div><div><label class="l">To‘plam nomi</label><input id="j_n"></div></div><textarea id="j_d" placeholder=\'[{"savol":"...","a":"..","b":"..","c":"..","d":"..","togri":"A","ball":1,"mavzu":"Algebra","izoh":""}]\' style="margin-top:10px"></textarea><button class="btn" style="margin-top:10px" onclick="impT()">Import</button></div>'+
  '<div class="card"><h2>🔍 Savollar</h2><div class="row"><select id="f_t" style="max-width:160px" onchange="TF.turi=this.value;vTst()"><option value="">Hammasi</option><option>sinov</option><option>blok</option><option>sertifikat</option></select><input id="f_q" placeholder="Qidirish" value="'+esc(TF.q)+'" style="max-width:260px" onkeydown="if(event.key===\'Enter\'){TF.q=this.value;vTst()}"><button class="btn o s" onclick="TF.q=$(\'f_q\').value;vTst()">Qidirish</button></div><div style="margin-top:12px">'+
  r.list.map(t=>'<div class="it"><div><b>'+esc(t.savol)+'</b><small>'+esc(t.turi)+' · '+esc(t.nomi)+' · to‘g‘ri: '+esc(t.togri)+(t.mavzu?' · '+esc(t.mavzu):'')+'</small></div><button class="btn s r" onclick="delT('+t.row+')">🗑</button></div>').join('')+'<p class="hint">Eng ko‘pi bilan 150 ta ko‘rsatiladi.</p></div></div>';
  $('f_t').value=TF.turi;
}
async function addT(){const g=i=>$(i).value.trim();if(!g('a_n')||!g('a_s')||!g('a_o')){toast('To‘plam nomi, savol va javob kerak');return}
  if(await act(()=>A('adminAddTest',{testTuri:g('a_t'),testNomi:g('a_n'),savol:g('a_s'),a:g('a_a'),b:g('a_b'),c:g('a_c'),d:g('a_d'),togri:g('a_o').toUpperCase(),ball:Number(g('a_p'))||1,izoh:g('a_i'),mavzu:g('a_m'),format:'variant'}),'✅ Savol qo‘shildi'))vTst()}
async function impT(){const n=$('j_n').value.trim(),d=$('j_d').value.trim();if(!n||!d){toast('Nom va JSON kerak');return}try{JSON.parse(d)}catch(e){toast('JSON xato: '+e.message);return}
  if(await act(()=>A('adminImportTestsJson',{testTuri:$('j_t').value,testNomi:n,dataJson:d}),'✅ Import qilindi'))vTst()}
async function delT(row){if(!confirm('Savol o‘chirilsinmi?'))return;if(await act(()=>A('adminDeleteTest',{row}),'🗑 O‘chirildi'))vTst()}

/* ---------- YOZMA ---------- */
async function vWr(){
  const r=await A('adminGetPendingWritten');if(!r.ok)return err(r);
  $('main').innerHTML='<h1>Yozma javoblar</h1>'+(r.list.map(w=>'<div class="card"><small style="color:var(--m)">ID '+esc(w.id)+' · '+esc(w.testTuri)+' · '+esc(w.testNomi)+'</small><div style="margin:6px 0;font-weight:700">'+esc(w.savol)+'</div><div style="padding:10px;border-left:3px solid var(--g);background:rgba(232,184,75,.07);border-radius:8px">'+esc(w.javob)+'</div><div class="row" style="margin-top:10px"><input id="wb'+w.row+'" type="number" placeholder="Qo‘shimcha ball" style="max-width:160px"><button class="btn s" onclick="wrDo('+w.row+')">Baholash</button></div></div>').join('')||'<p style="color:var(--m)">Tekshiriladigan javob yo‘q ✅</p>');
}
async function wrDo(row){const b=Number($('wb'+row).value);if(!isFinite(b)){toast('Ball kiriting');return}if(await act(()=>A('adminGradeWritten',{row,qoshimchaBall:b}),'✅ Baholandi'))vWr()}

/* ---------- VIDEO ---------- */
async function vVid(){
  const r=await A('adminVideoList');if(!r.ok)return err(r);
  $('main').innerHTML='<h1>Video darslar <span class="tag">'+r.list.length+'</span></h1><div class="card"><h2>➕ Video qo‘shish</h2><div class="f"><input id="v_f" placeholder="Fan (Matematika)"><input id="v_m" placeholder="Mavzu (Logarifm)"><input id="v_t" placeholder="Sarlavha"><input id="v_l" placeholder="YouTube havolasi"><input id="v_d" placeholder="Davomiyligi (18:20)"></div><button class="btn" style="margin-top:12px" onclick="vAdd()">Qo‘shish</button><p class="hint">Fan va mavzu nomini savollardagi nom bilan bir xil yozing — shunda zaif mavzular bo‘yicha tavsiya ishlaydi.</p></div>'+
  r.list.slice().reverse().map(v=>'<div class="it"><div><b>'+esc(v.title)+'</b><small>'+esc(v.fan)+' › '+esc(v.topic)+(v.dur?' · '+esc(v.dur):'')+'</small><small><a style="color:var(--g2)" target="_blank" rel="noopener" href="'+esc(v.link)+'">'+esc(v.link.slice(0,50))+'</a></small></div><div class="row"><span class="tag '+(v.off?'bad':'ok')+'">'+(v.off?'o‘chiq':'faol')+'</span><button class="btn s o" onclick="vTog('+v.row+')">'+(v.off?'Yoqish':'O‘chirish')+'</button><button class="btn s r" onclick="vDel('+v.row+')">🗑</button></div></div>').join('');
}
async function vAdd(){const g=i=>$(i).value.trim();if(await act(()=>A('adminVideoAdd',{fan:g('v_f'),topic:g('v_m'),title:g('v_t'),link:g('v_l'),dur:g('v_d')}),'✅ Video qo‘shildi'))vVid()}
async function vTog(row){if(await act(()=>A('adminVideoToggle',{row}),'✅ O‘zgardi'))vVid()}
async function vDel(row){if(!confirm('Video o‘chirilsinmi?'))return;if(await act(()=>A('adminVideoDel',{row}),'🗑 O‘chirildi'))vVid()}

try{const p=sessionStorage.getItem('adm_pw');if(p){$('pw').value=p;login()}}catch(e){}
</script></body></html>
