<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0d">
<title>Texnik ishlar — ABITUR DTM</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(circle at 50% 30%,#1c1a14,#0b0b0d 70%);color:#f2efe6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:420px;text-align:center;background:#141416;border:1px solid rgba(232,184,75,.35);border-radius:22px;padding:30px 22px;box-shadow:0 10px 50px rgba(0,0,0,.5)}
.box img{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 0 18px rgba(232,184,75,.4))}
.brand{margin:8px 0 18px;letter-spacing:6px;font-weight:700;font-size:14px;color:#e8b84b}
.gear{font-size:46px;display:inline-block;animation:sp 4s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
h1{font-size:22px;margin:10px 0 8px}
p{color:#a9a69b;font-size:14px;line-height:1.6;margin:0 0 6px}
.bar{height:6px;border-radius:6px;background:#26262a;overflow:hidden;margin:20px 0 18px}
.bar i{display:block;height:100%;width:40%;border-radius:6px;background:linear-gradient(90deg,#f1d27a,#e8b84b);animation:mv 1.6s ease-in-out infinite}
@keyframes mv{0%{margin-left:-40%}100%{margin-left:100%}}
a.btn{display:inline-block;margin-top:6px;padding:11px 20px;border-radius:12px;border:1px solid #e8b84b;color:#e8b84b;text-decoration:none;font-weight:600;font-size:14px}
small{display:block;margin-top:16px;color:#6f6c63;font-size:12px}
</style>
</head>
<body>
<div class="box">
  <img src="assets/logo.png" alt="ABITUR DTM" onerror="this.style.display='none'">
  <div class="brand">ABITUR DTM</div>
  <div class="gear">⚙️</div>
  <h1>Texnik ishlar olib borilmoqda</h1>
  <p>Saytni yanada yaxshilash ustida ishlayapmiz.</p>
  <p>Tez orada qaytamiz. Sabr qilganingiz uchun rahmat!</p>
  <div class="bar"><i></i></div>
  <a class="btn" href="https://t.me/Xumoyun_1509" target="_blank" rel="noopener">Savol bo‘lsa: Telegram</a>
  <small>Sahifa har 60 soniyada o‘zi yangilanadi</small>
</div>
<script>setTimeout(function(){location.reload()},60000)</script>
</body>
</html>
